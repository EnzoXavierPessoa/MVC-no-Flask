
<form action="{{ url_for('editar', id_tarefa=tarefa_edicao.id) if tarefa_edicao else url_for('home') }}" method="POST">
    <input 
        type="text" 
        name="tituloTarefa" 
        placeholder="Título da tarefa" 
        value="{{ tarefa_edicao.titulo if tarefa_edicao else '' }}" 
        required
    >
    <input 
        type="date" 
        name="dataConclusao" 
        value="{{ tarefa_edicao.data_conclusao if tarefa_edicao else '' }}" 
        required
    >
    <button type="submit">
        {{ 'Salvar Alterações' if tarefa_edicao else 'Adicionar Tarefa' }}
    </button>

    {% if tarefa_edicao %}
        <a href="{{ url_for('home') }}">Cancelar</a>
    {% endif %}
</form>
